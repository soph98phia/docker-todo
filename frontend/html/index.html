<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker To-Do</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1>To-Do List</h1>
        <p class="subtitle">Nginx + FastAPI + PostgreSQL, orchestrated with Docker Compose</p>

        <form id="todo-form">
            <input id="todo-input" type="text" placeholder="What needs to be done?" maxlength="200" required>
            <button type="submit">Add</button>
        </form>

        <ul id="todo-list"></ul>
        <p id="status" class="status"></p>
    </main>

    <script src="app.js"></script>
</body>
</html>
